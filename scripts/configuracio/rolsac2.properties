# Propietats de configuracio de rolsac2.
# La ubicacio d'aquest fitxer s'ha de registrar mitjançant la propietat de sistema
# es.caib.rolsac2.properties (veure apartat 3.5.2 dels estandards)
# (el fitxer empra la codificacio UTF-8)

## BACKEND START

#Propiedad para almacenamiento de ficheros ROLSAC2
ficherosExternos.path=S:\\files_rs2

#Propiedad para almacenamiento de ficheros de ROLSAC1 (cuando se realiza la migración de ROLSAC1 a ROLSAC2)
ficherosRolsac1.path=S:\\files_rolsac1

#Propiedades para gestion procesos automaticos
#Expresion cron maestra (configurado para ejecutarse cada 30 min)
procesos.automaticos.cron=0 */30 * * *

#Tiempo maximo que esperaran las otras instancias en caso de que la instancia maestro no ejecute los procesos
procesos.minMaxMaestroInactivo=15

# Literales cuando se realiza una accion en el flujo.
# Este apartado podría ir por configuración global
es.caib.rolsac2.procServ.accion.S.es=Se solicita la publicacion del contenido
es.caib.rolsac2.procServ.accion.S.ca=Se sol·licita la publicacio del contingut
es.caib.rolsac2.procServ.accion.U.es=Se solicita eliminar el contenido
es.caib.rolsac2.procServ.accion.U.ca=Se sol·licita eliminar el contingut
es.caib.rolsac2.procServ.accion.T.es=Se solicita cerrar el contenido
es.caib.rolsac2.procServ.accion.T.ca=Se sol·licita tancar el contigut
es.caib.rolsac2.procServ.accion.M.es=Es torna a enviar a modificacio
es.caib.rolsac2.procServ.accion.M.ca=Se vuelve a enviar a modificacion
es.caib.rolsac2.procServ.accion.P.es=El contenido esta publicado
es.caib.rolsac2.procServ.accion.P.ca=El contingut s'ha publicat
es.caib.rolsac2.procServ.accion.R.es=El contenido esta en estado reserva
es.caib.rolsac2.procServ.accion.R.ca=El contingut es troba en estat reserva
es.caib.rolsac2.procServ.accion.B.es=El contenido esta eliminado
es.caib.rolsac2.procServ.accion.B.ca=El contingut esta esborrat

#Cuando se crea una UA desde 0, es lo que se muestra en el campo comun de la UA (luego en los procedimientos se utiliza lo de la entidad editada)
es.caib.rolsac2.comun.ua.es=El organo competente por materia
es.caib.rolsac2.comun.ua.ca=L'organ competent per materia

