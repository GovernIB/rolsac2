<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"

      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>
<ui:composition template="/WEB-INF/templates/layoutDialog.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{dialogSeleccionCategoriaPDU.load}"/>
        </f:metadata>
    </ui:define>
    <ui:define name="pageTitleDialog">
        <h:outputFormat value="#{labels['viewCategoriasPDU.titulo']}"/>
    </ui:define>
    <ui:define name="contentDialog">
        <p:growl id="messagesDialog"
                 globalOnly="false"
                 showDetail="false"
                 life="5000"
                 escape="false"/>
        <h:outputStylesheet>
            .panelSinBotonToggle .ui-panel-titlebar-icon {
                display: none;
            }
        </h:outputStylesheet>
        <div class="row" style="margin-right: 0px;">
        <div class="ui-g-12 ui-md-9 pl-3 panel-container">
                        <p:commandButton value="#{labels['dict.actualizar']}" id="actualizarBusqueda"
                             style="display:none" ajax="false" action="#{dialogSeleccionCategoriaPDU.buscar}"
                             update="dataTable messagesDialog" pt:aria-label="#{labels['dict.actualizar']}"/>
                     <p:panel id="panel" styleClass="panelSinBotonToggle mb-1" toggleSpeed="500" toggleable="true" closeSpeed="500"
                                 widgetVar="panel" collapsed="true">
                        <f:facet name="header">
                            <div class="row">
                                <div class="ui-g-12 ui-md-9 ui-lg-9">
                                    <p:outputLabel value="#{labels['dict.filtro']}" pt:aria-label="#{labels['dict.filtro']}"/>:
                                    <p:inputText id="filtroBusqueda"
                                                                                                     value="#{dialogSeleccionCategoriaPDU.filtro.texto}"/>
                                    <p:commandButton value="#{labels['dict.busqueda']}" icon="pi pi-search" styleClass="ml-2"
                                                     update="dataTable messagesDialog"
                                                     actionListener="#{dialogSeleccionCategoriaPDU.buscar()}" process="@form" pt:aria-label="#{labels['dict.busqueda']}"/> 
                                </div>
                                <div class="ui-g-12 ui-md-3 ui-lg-3 text-right">
                                    <p:commandButton id="btnAnyadir" value="#{labels['dict.anyadir']}"
                                                     actionListener="#{dialogSeleccionCategoriaPDU.anadirCategoriaPDULista()}"
                                                     update="messagesDialog dataTableCategoriaPDU"
                                                     disabled="#{empty dialogSeleccionCategoriaPDU.datoSeleccionado}"
                                                     icon="pi pi-plus" pt:aria-label="#{labels['dict.anyadir']}"></p:commandButton>
                                </div>
                            </div>
                        </f:facet>
                     </p:panel>
            <p:dataTable id="dataTable" value="#{dialogSeleccionCategoriaPDU.lazyModel}" var="CategoriaPDU"
                         paginator="true" lazy="true" filterDelay="300" widgetVar="categoriaPDUTable"
                         rows="#{dialogSeleccionCategoriaPDU.filtro.paginaTamanyo}" rowsPerPageTemplate="10,20,50,100"
                         first="#{dialogSeleccionCategoriaPDU.filtro.paginaFirst}"
                         paginatorPosition="bottom" paginatorAlwaysVisible="true"
                         paginatorTemplate="{RowsPerPageLabel} {RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport}
                         {NextPageLink} {LastPageLink}"
                         currentPageReportTemplate="#{labels.dataTable_currentPageReport} - #{labels.dataTable_elementsFound}: {totalRecords}"
                         emptyMessage="#{labels['dict.noHayDatos']}"
                         selectionMode="single" selection="#{dialogSeleccionCategoriaPDU.datoSeleccionado}"
                         reflow="true"
                         style="min-height: 300px;"
            >
                <p:ajax event="rowUnselect" global="false"  update="@form:btnAnyadir"  process="@form" />
                <p:ajax event="rowSelect" global="false"  update="@form:btnAnyadir"  process="@form" />
                <p:ajax
                        event="rowDblselect"
                        oncomplete="triggerDblClickGrid();"
                        global="false"/>
                <f:facet name="{RowsPerPageLabel}">
                    #{labels.dataTable_rowsPerPage}
                </f:facet>
                <p:column sortBy="#{CategoriaPDU.codigo}">
                    <f:facet name="header">#{labels['dict.codigo']}</f:facet>
                    <h:outputText value="#{CategoriaPDU.codigo}"/>
                </p:column>
                <p:column sortBy="#{CategoriaPDU.identificador}">
                    <f:facet name="header">#{labels['dict.identificador']}</f:facet>
                    <h:outputText value="#{CategoriaPDU.identificador}"/>
                </p:column>
                <p:column sortBy="#{CategoriaPDU.descripcion}" styleClass="overflow-datagrid-cell">
                    <f:facet name="header">#{labels['dict.descripcion']}</f:facet>
                    <h:outputText value="#{CategoriaPDU.descripcion.getTraduccion(sessionBean.lang)}"/>
                </p:column>
            </p:dataTable>

            <h:outputScript>
                function triggerDblClickGrid() {
                    $('#formDialog\\:btnAnyadir').click();
                }
            </h:outputScript>

            <p:commandButton  id="btnEditarHidden" name="btnEditarHidden" widgetVar="btnEditarHidden"
                              actionListener="#{dialogSeleccionCategoriaPDU.anadirCategoriaPDULista()}" process="@this"
                              update="messagesDialog dataTableCategoriaPDU "
                              style="display: none" pt:aria-label="btnEditarHidden">
                <!--<p:ajax event="dialogReturn" listener="#{viewEntidades.returnDialogo}" update="messages dataTable"/>-->
            </p:commandButton>

        </div>

        <div class="ui-g-12 ui-md-3 p-0 mt-2 pl-3">
            <div class="col-12 left-container-header text-center"  style="height:30px">
                <p class="left-container-tit mt-2 mb-1" style="font-size: 1.1em;">#{labels['viewCategoriasPDU.titulo']}</p>
            </div>
            <div class="row pl-3" style="margin-right: 0px;">
                <div class="col-10 p-1 left-container">
                <p:dataTable id="dataTableCategoriaPDU" var="td" value="#{dialogSeleccionCategoriaPDU.categoriaPDUsSeleccionadas}"
                             emptyMessage="#{labels['dialogProcedimiento.tablaVacia']}" scrollable="true"
                             paginator="false" selectionMode="single"
                             selection="#{dialogSeleccionCategoriaPDU.categoriaPDUGridSeleccionada}"
                             rowKey="#{td.codigo}" styleClass="noHeader">

                    <!-- Necesario para actualizar en controlador la fila seleccionada -->
                    <p:ajax event="rowSelect" global="false"/>
                    <p:ajax event="rowUnselect"/>
                    <p:column headerText="#{labels['dict.titulo']}" styleClass="text-center">
                        <p:outputLabel value="#{td.descripcion.getTraduccionConValor(sessionBean.lang)}" pt:aria-label="#{td.descripcion.getTraduccionConValor(sessionBean.lang)}"/>
                    </p:column>
                </p:dataTable>
            </div>
            <div class="col-2 p-1 d-flex flex-column align-content-center justify-content-center align-items-center left-container">
                <p:commandButton title="Eliminar" icon="pi pi-minus" styleClass="text-danger"
                                 action="#{dialogSeleccionCategoriaPDU.borrarCategoriaPDU}"
                                 process="@this" update="dataTableCategoriaPDU messagesDialog" pt:aria-label="Eliminar"/>
            </div>
            </div>
        </div>
        </div>
    </ui:define>
    <ui:define name="contentFooterDialogRight">
        <p:commandButton action="#{dialogSeleccionCategoriaPDU.guardar}"
                         value="#{labels['dict.aceptar']}" update="messagesDialog"
                         rendered="#{!dialogProcedimiento.isModoConsulta()}"
                         process="@all" pt:aria-label="#{labels['dict.aceptar']}"/>
        <p:commandButton action="#{dialogSeleccionCategoriaPDU.cerrar}"
                         value="#{labels['dict.cerrar']}" update="messagesDialog"
                         process="@this" pt:aria-label="#{labels['dict.cerrar']}"/>
    </ui:define>
</ui:composition>
</html>
