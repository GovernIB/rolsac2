<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:my="http://java.sun.com/jsf/composite/components"
      xmlns:c="http://java.sun.com/jsp/jstl/core"

      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>
<!--
Pàgina amb el llistat de personal d'una unitat administrativa.
-->
<ui:composition template="/WEB-INF/templates/layoutDialog.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam id="MODO_ACCESO" name="MODO_ACCESO" value="#{dialogDocumentoProcedimientoLOPD.modoAcceso}"/>
            <f:viewParam id="ID" name="ID" value="#{dialogDocumentoProcedimientoLOPD.idProcedimento}"/>
            <f:viewParam id="TIPO" name="TIPO" value="#{dialogDocumentoProcedimientoLOPD.tipo}"/>
            <f:viewAction action="#{dialogDocumentoProcedimientoLOPD.load}"/>
        </f:metadata>
    </ui:define>


    <ui:define name="pageTitleDialog">

        <h:outputFormat value="#{labels['dialogDocumentoProcedimientoLOPD.detalle.' += dialogDocumentoProcedimientoLOPD.tipo]} - #{dialogDocumentoProcedimientoLOPD.data.codigo} "
                        rendered="#{!dialogDocumentoProcedimientoLOPD.isModoAlta()}"/>
        <h:outputFormat value="#{labels['dialogDocumentoProcedimientoLOPD.nuevo.documento.' += dialogDocumentoProcedimientoLOPD.tipo]}"
                        rendered="#{dialogDocumentoProcedimientoLOPD.isModoAlta()}"/>
    </ui:define>

    <ui:define name="contentIdioma">

        <span class="pi pi-tag" style="margin-top:10px"/>
        <p:outputLabel value="#{labels['dict.idioma']}:" style="margin-right:4px;margin-top:2px;" pt:aria-label="#{labels['dict.idioma']}:"/>
        <p:selectOneButton id="opcionIdioma" value="#{dialogDocumentoProcedimientoLOPD.idioma}" styleClass="botoneraRed">
            <f:selectItems value="#{sessionBean.getIdiomasPermitidosList()}" var="idioma"
                           itemValue="#{idioma}" itemLabel="#{labels['idiomas.' += idioma]}"/>
            <p:ajax update="formDialog:documentosMulti" process="@this"/>
        </p:selectOneButton>
    </ui:define>

    <ui:define name="contentDialog">
        <p:growl id="messagesDialog"
                 globalOnly="false"
                 showDetail="false"
                 life="5000"
                 escape="false"/>

        <p:panel id="form">
            <div class="row">

                <div class="ui-g-12 ui-md-2 ui-lg-1">
                    <p:outputLabel value="#{labels['dict.plantilla']}:" pt:aria-label="#{labels['dict.plantilla']}:"  />
                </div>
                <div class="ui-g-12 ui-md-10 ui-lg-5">
                    <c:forEach items="#{sessionBean.getIdiomasPermitidosList()}" var="idioma">
                        <p:column rendered="#{!empty sessionBean.entidad.lopdPlantilla.getTraduccion(idioma)}">
                            <h:outputLink value="#{sessionBean.entidad.lopdPlantilla.getTraduccion(idioma)}" style="margin-right:15px;font-weight: bold; color: #177ff0;" target="_blank">
                                <p:outputLabel value="#{labels['dict.' += idioma]}" pt:aria-label="#{labels['dict.' += idioma]}" />
                            </h:outputLink>
                        </p:column>
                    </c:forEach>
                </div>

                <div class="ui-g-12 ui-md-2 ui-lg-2">
                    <p:outputLabel value="#{labels['dict.documento']}*:" pt:aria-label="#{labels['dict.documento']}*:"/>
                </div>
                <div class="ui-g-12 ui-md-10 ui-lg-4">
                    <p:panel id="documentosMulti">
                        <c:forEach items="#{sessionBean.getIdiomasPermitidosList()}" var="idioma">
                            <p:panel id="#{labels['dialog.doc.txt.' += idioma]}" styleClass="logo-form w95"
                                     rendered="#{idioma.equals(dialogDocumentoProcedimientoLOPD.idioma)}">
                                <c:choose>
                                    <c:when test="#{!dialogDocumentoProcedimientoLOPD.hasDocument(idioma)}">
                                        <p:fileUpload listener="#{dialogDocumentoProcedimientoLOPD.handleDocUpload}"
                                                      mode="advanced"
                                                      dragDropSupport="true"
                                                      fileLimit="3"
                                                      allowTypes="/(\.|\/)(pdf)$/"
                                                      onupload=""
                                                      label="#{labels['dict.anyadir']}"
                                                      cancelLabel="#{labels['dict.cancelar']}"
                                                      styleClass=""
                                                      auto="true"
                                                      rendered="#{!dialogDocumentoProcedimientoLOPD.isModoConsulta()}"
                                                      update="formDialog:#{labels['dialog.doc.txt.' += idioma]} messagesDialog"
                                        />
                                    </c:when>
                                    <c:otherwise>
                                        <p:commandButton id="logoDescarga"
                                                         value="#{dialogDocumentoProcedimientoLOPD.getFileName(idioma)}"
                                                         ajax="false" process="@this"
                                                         icon="pi pi-arrow-down" pt:aria-label="#{dialogDocumentoProcedimientoLOPD.getFileName(idioma)}">
                                            <p:fileDownload
                                                    value="#{dialogDocumentoProcedimientoLOPD.obtenerDocumento(idioma)}"></p:fileDownload>
                                        </p:commandButton>
                                        <p:commandButton actionListener="#{dialogDocumentoProcedimientoLOPD.eliminarDocumento(idioma)}"
                                                         disabled="#{dialogDocumentoProcedimientoLOPD.isModoConsulta()}"
                                                         icon="pi pi-times" process="@this" update="formDialog:#{labels['dialog.doc.txt.' += idioma]}" pt:aria-label="Boton"
                                        ></p:commandButton>
                                    </c:otherwise>
                                </c:choose>
                            </p:panel>
                        </c:forEach>
                    </p:panel>
                </div>
            </div>
        </p:panel>


    </ui:define>

    <ui:define name="contentFooterDialogRight">
        <p:commandButton action="#{dialogDocumentoProcedimientoLOPD.guardar}"
                         value="#{labels['dict.aceptar']}" update="messagesDialog form"
                         process="@all"
                         disabled="#{dialogDocumentoProcedimientoLOPD.isModoConsulta()}" pt:aria-label="#{labels['dict.aceptar']}"/>
        <p:commandButton action="#{dialogDocumentoProcedimientoLOPD.cerrar}"
                         value="#{labels['dict.cerrar']}" update="messagesDialog"
                         process="@this" pt:aria-label="#{labels['dict.cerrar']}"/>

    </ui:define>

</ui:composition>
</html>
