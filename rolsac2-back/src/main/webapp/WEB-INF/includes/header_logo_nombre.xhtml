<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition>
    <!-- Logo i nom aplicació -->
    <div class="navbar-brand menuGovern">
        <div class="logoGovern">
                <p:link id="imgLogo" styleClass="mr-auto" outcome="/index" style="" >
                    <p:graphicImage styleClass="imatgeGovern"
                                    value="#{sessionBean.getLogoEntidad()}"
                                     cache="false" rendered="#{sessionBean.checkLogo()}"></p:graphicImage>
                </p:link>
                <p:link id="imgDefecto" styleClass="mr-auto" outcome="/index" style="" >
                    <h:graphicImage name="img/logo.png" styleClass="imatgeGovern"
                                    alt="Govern de les Illes Balears" rendered="#{!sessionBean.checkLogo()}"/>
                </p:link>
        </div>
        <div class="logoRolsacContainer">
            <p:graphicImage name="img/logo_rolsac.png" alt="Logo Rolsac" styleClass="logoStyle" />
            <div  style="color:black; font-size: 0.8em !important;" >

                <strong class="subtitol">#{labels['dict.usuario']}: </strong>
                <span class="subtitolMay">
                        #{sessionBean.getUsuario().getIdentificador()}
                </span>
            </div>

        </div>


    </div>
    <!-- FI Logo i nom aplicació -->
</ui:composition>
</html>
