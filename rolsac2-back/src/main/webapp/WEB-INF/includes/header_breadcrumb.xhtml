<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:my="http://java.sun.com/jsf/composite/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"

      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>
<ui:composition>

    <nav class="navbar navbar-light navbar-expand-lg flex-column justify-content-start align-items-start" style="background: #FFF">
        <div class="d-flex flex-column" style="width: 100% !important;">


            <c:if test="#{!empty sessionBean.alertas}">
                <h:outputStylesheet>
                    .iconoAlertaLeido {
                        background: transparent;
                        border: none;
                        box-shadow: none;
                    }
                </h:outputStylesheet>
                <div style="flex-grow:100;margin-left:20px;">
                    <c:forEach items="#{sessionBean.alertas}" var="alerta" varStatus="status">
                        <!-- ID dinámico basado en el índice -->
                        <div id="alerta-#{status.index}" class="w-full row">
                            <div class="ui-g-12 claseAlerta mt-2 mr-3">
                                <p:commandButton
                                        action="#{sessionBean.marcarAlertaLeida(alerta.codigo)}"
                                        icon="pi pi-times-circle"
                                        value=" "
                                        styleClass="w45px h25px iconoAlertaLeido botonBordeado"
                                        process="@this"
                                        update="@parent" pt:aria-label=" "
                                />
                                <p:outputLabel value="#{alerta.fechaIni}" pt:aria-label="#{alerta.fechaIni}">
                                    <f:convertDateTime type="date" pattern="dd/MM/yyyy HH:mm"/>
                                </p:outputLabel>
                                <p:outputLabel value="- #{alerta.fechaFin}" rendered=" #{!empty alerta.fechaFin}" pt:aria-label="- #{alerta.fechaFin}">
                                    <f:convertDateTime type="date" pattern="dd/MM/yyyy HH:mm"/>
                                </p:outputLabel>
                                <p:outputLabel value=" : #{alerta.descripcion.getTraduccionConValor(sessionBean.lang)}" styleClass="ml-2" pt:aria-label=" : #{alerta.descripcion.getTraduccionConValor(sessionBean.lang)}" />
                            </div>
                        </div>
                    </c:forEach>
                </div>
            </c:if>
            <button id="btnCollapseNavbar2" class="navbar-toggler ml-1" type="button" data-toggle="collapse" data-target="#collapsingNavbar2" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <c:if test="#{sessionBean.getPerfil() == TypePerfiles.GESTOR or sessionBean.getPerfil() == TypePerfiles.INFORMADOR or sessionBean.getPerfil() == TypePerfiles.ADMINISTRADOR_CONTENIDOS or (sessionBean.getUri().contains('viewUnidadAdministrativa.xhtml') and sessionBean.getPerfil()== TypePerfiles.ADMINISTRADOR_ENTIDAD)}">
                <div class="mt-2">
                    <ui:insert name="mollaPaGestor"></ui:insert>
                </div>
            </c:if>
        </div>

    </nav>

</ui:composition>
</html>
