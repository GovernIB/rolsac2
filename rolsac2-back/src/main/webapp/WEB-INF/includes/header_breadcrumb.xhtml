<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:my="http://java.sun.com/jsf/composite/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"

      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>
<ui:composition>

    <nav class="navbar navbar-light navbar-expand-lg flex-column justify-content-start align-items-start" style="background: #FFF">
        <div class="d-flex flex-column" style="width: 100% !important;">


            <c:if test="#{!empty sessionBean.alertas}">

                <c:forEach items="#{sessionBean.alertas}" var="alerta" varStatus="status">

                    <div id="alerta-#{status.index}" class="w-full row">
                        <div class="ui-g-12 claseAlerta mt-2 mr-3">
                            <div class="alertaContenido">

                                <p:commandButton
                                        action="#{sessionBean.marcarAlertaLeida(alerta.codigo)}"
                                        icon="pi pi-times-circle"
                                        styleClass="botonAlertaLeida"
                                        process="@this"
                                        update="@parent"
                                        ariaLabel="#{labels['msg.marcarAlertaComoLeido']}"
                                />

                                <p:outputLabel value="#{alerta.fechaIni}" style="margin-bottom:  -10px;">
                                    <f:convertDateTime type="date" pattern="dd/MM/yyyy HH:mm"/>
                                </p:outputLabel>

                                <p:outputLabel value="- #{alerta.fechaFin}"
                                               rendered="#{!empty alerta.fechaFin}" style="margin-bottom:  -10px;">
                                    <f:convertDateTime type="date" pattern="dd/MM/yyyy HH:mm"/>
                                </p:outputLabel>

                                <p:outputLabel
                                        value=" : #{alerta.descripcion.getTraduccionConValor(sessionBean.lang)}" style="margin-bottom: -10px;"/>

                            </div>
                        </div>
                    </div>

                </c:forEach>

            </c:if>
            <button id="btnCollapseNavbar2" class="navbar-toggler ml-1" type="button" data-toggle="collapse" data-target="#collapsingNavbar2" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <c:if test="#{sessionBean.getPerfil() == TypePerfiles.GESTOR or sessionBean.getPerfil() == TypePerfiles.INFORMADOR or sessionBean.getPerfil() == TypePerfiles.ADMINISTRADOR_CONTENIDOS or (sessionBean.getUri().contains('viewUnidadAdministrativa.xhtml') and sessionBean.getPerfil()== TypePerfiles.ADMINISTRADOR_ENTIDAD)}">
                <div class="mt-2">
                    <ui:insert name="mollaPaGestor"></ui:insert>
                </div>
            </c:if>
        </div>

    </nav>

</ui:composition>
</html>
