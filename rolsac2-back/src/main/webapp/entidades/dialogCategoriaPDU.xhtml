<html xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:my="http://java.sun.com/jsf/composite/components"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns="http://www.w3.org/1999/xhtml"

      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
>
<!--
Pàgina amb el llistat de personal d'una unitat administrativa.
-->
<ui:composition template="/WEB-INF/templates/layoutDialog.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam id="MODO_ACCESO" name="MODO_ACCESO" value="#{dialogCategoriaPDU.modoAcceso}"/>
            <f:viewParam id="ID" name="ID" value="#{dialogCategoriaPDU.id}"/>
            <f:viewAction action="#{dialogCategoriaPDU.load}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="pageTitleDialog">
        <h:outputFormat value="#{labels['dialogCategoriaPDU.consulta']}"
                        rendered="#{dialogCategoriaPDU.isModoConsulta()}"/>
        <h:outputFormat value="#{labels['dialogCategoriaPDU.detalle']}"
                        rendered="#{dialogCategoriaPDU.isModoEdicion()}"/>
        <h:outputFormat value="#{labels['dialogCategoriaPDU.nuevo']}"
                        rendered="#{dialogCategoriaPDU.isModoAlta()}"/>
    </ui:define>

    <ui:define name="contentIdioma">

        <span class="pi pi-tag" style="margin-top:10px"/>
        <p:outputLabel value="#{labels['dict.idioma']}:" style="margin-right:4px;margin-top:2px;" pt:aria-label="#{labels['dict.idioma']}:"/>
        <p:selectOneButton id="opcionIdioma" value="#{dialogCategoriaPDU.idioma}" styleClass="botoneraRed"
                           unselectable="false">
            <f:selectItems value="#{sessionBean.getIdiomasPermitidosList()}" var="idioma"
                           itemValue="#{idioma}" itemLabel="#{labels['idiomas.' += idioma]}"/>
            <p:ajax update="inputDescripcion" process="@this"/>
        </p:selectOneButton>
        <p:commandButton action="#{dialogCategoriaPDU.traducir}"
                         icon="pi pi-compass" iconPos="top"
                         value="#{labels['dict.traducir']}"
                         style="margin-left:10px"
                         update="messagesDialog"
                         process="@this"
                         rendered="#{!dialogCategoriaPDU.isModoConsulta() and dialogCategoriaPDU.tradExiste()}" pt:aria-label="#{labels['dict.traducir']}">
            <p:ajax event="dialogReturn" listener="#{dialogCategoriaPDU.returnDialogTraducir}" process="@this"
                    update="formDialog:inputDescripcion"/>
        </p:commandButton>
    </ui:define>

    <ui:define name="contentDialog">
        <p:panel id="form">
            <p:growl id="messagesDialog"
                     globalOnly="false"
                     showDetail="false"
                     life="5000"
                     escape="false"/>

            <div class="row">

                <div class="ui-g-12 ui-md-2 ui-lg-1">
                    <p:outputLabel value="#{labels['dict.codigo']}:" for="txtCodigo" pt:aria-label="#{labels['dict.codigo']}:"/>
                </div>
                <div class="ui-g-12 ui-md-10 ui-lg-5">
                    <p:inputText id="txtCodigo" value="#{dialogCategoriaPDU.data.codigo}"
                                 styleClass="w96" disabled="true" maxlength="50"/>
                </div>

                <div class="ui-g-12 ui-md-2 ui-lg-1">
                    <p:outputLabel value="#{labels['dict.identificador']}:" for="txtIdentificador" pt:aria-label="#{labels['dict.identificador']}:"/>
                </div>
                <div class="ui-g-12 ui-md-10 ui-lg-5">
                    <p:inputText id="txtIdentificador" value="#{dialogCategoriaPDU.data.identificador}"
                                 requiredMessage="#{labels['dict.obligatorio.identificador']}"
                                 styleClass="w96" onblur="this.value = this.value.toUpperCase();"
                                 required="#{empty param['formDialog:closeButton']}" disabled="#{dialogCategoriaPDU.isModoConsulta()}" maxlength="50"
                                 onpaste="validatePaste(event, /^[a-z0-9_-]{1,50}$/i)">
                        <p:keyFilter regEx="/[a-z0-9_-]/i" preventPaste="false"/>
                        <f:validateRegex pattern="^[a-zA-Z0-9_-]{1,50}$"/>
                        <f:validateBean disabled="true"/>
                    </p:inputText>
                </div>

                <div class="ui-g-12 ui-md-2 ui-lg-1">
                    <p:outputLabel value="#{labels['dict.descripcion']}:" for="inputDescripcion" pt:aria-label="#{labels['dict.descripcion']}:"/>
                </div>
                <div class="ui-g-12 ui-md-10 ui-lg-5">
                    <my:literalComponent id="inputDescripcion" literal="#{dialogCategoriaPDU.data.descripcion}"
                                         soloLecture="#{dialogCategoriaPDU.isModoConsulta()}"
                                         required="#{empty param['formDialog:closeButton']}"
                                         idioma="#{dialogCategoriaPDU.idioma}"
                                         idiomasObligatorios="#{sessionBean.getIdiomasObligatorios()}"
                                         idiomasPermitidos="#{sessionBean.getIdiomasPermitidos()}"
                                         nombreLiteral="#{labels['dict.descripcion']}"
                                         maxlength="255">
                        <f:validator validatorId="es.caib.rolsac2.back.validators.ValidadorLiteral"/>
                    </my:literalComponent>
                </div>
            </div>
        </p:panel>

        <p:commandButton id="growlMessage" action="#{messageUtils.showInvalidCharacterMessage}" style="display:none;"
                         update="messagesDialog form" pt:aria-label="growlMessage"/>
        <script>
            function validatePaste(event, regex) {
                const clipboardData = (event.clipboardData || window.clipboardData).getData('text');
                if (!regex.test(clipboardData)) {
                    event.preventDefault();
                    document.getElementById('formDialog:growlMessage').click();
                }
            }
        </script>
    </ui:define>

    <ui:define name="contentFooterDialogRight">
        <p:commandButton action="#{dialogCategoriaPDU.guardar}"
                         value="#{labels['dict.guardar']}" update="messagesDialog form"
                         rendered="#{!dialogCategoriaPDU.isModoConsulta()}"
                         process="@all" pt:aria-label="#{labels['dict.guardar']}" />
        <p:commandButton action="#{dialogCategoriaPDU.cerrar}" id="closeButton"
                         value="#{labels['dict.cerrar']}" update="messagesDialog"
                         process="@all" oncomplete="stopCargando()" onstart="startCargando()" pt:aria-label="#{labels['dict.cerrar']}"/>
        <p:confirmDialog showEffect="fade" hideEffect="fade" header="#{labels['dict.cerrar.cambiosSinGuardar.titulo']}"
                         responsive="true" width="458px" message="#{labels['dict.cerrar.cambiosSinGuardar.mensaje']}"
                         widgetVar="confirmCerrar">
            <p:commandButton value="#{labels['dict.si']}" action="#{dialogCategoriaPDU.cerrarDefinitivo}" process="@this"
                             update="messagesDialog form" oncomplete="PF('confirmCerrar').hide();" pt:aria-label="#{labels['dict.si']}"/>
            <p:commandButton value="#{labels['dict.no']}" onclick="PF('confirmCerrar').hide();" pt:aria-label="#{labels['dict.no']}"/>
        </p:confirmDialog>
    </ui:define>

</ui:composition>
</html>
