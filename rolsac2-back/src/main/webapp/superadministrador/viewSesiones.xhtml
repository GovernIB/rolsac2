<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{viewSesiones.load}"/>
        </f:metadata>
    </ui:define>
    <ui:define name="pageTitle">
        <h:outputFormat value="#{labels['viewSesiones.titulo.pagina']}" />
    </ui:define>
    <ui:define name="content">
        <h:form id="form">
            <p:commandButton value="#{labels['viewSesiones.actualizar']}" id="actualizarBusqueda"
                             style="display:none" ajax="false" action="#{viewSesiones.buscar}"
                             update="dataTable"/>
            <p:toolbar id="toolbar"  style="padding-top: 10px; padding-bottom: 10px;">
                <f:facet name="left">
                    <h:outputFormat value="#{labels['dict.filtro']}"/>: <p:inputText id="filtroBusqueda"
                                                                                     value="#{viewSesiones.filtroIdentificador}"/>
                    <p:commandButton value="#{labels['dict.busqueda']}" icon="pi pi-search" update="messages dataTable"
                                     actionListener="#{viewSesiones.buscar()}" process="@form"/>
                </f:facet>
                <f:facet name="right">
                    <p:commandButton value="#{labels['dict.borrar']}" icon="pi pi-trash" iconPos="top"
                                     action="#{viewSesiones.borrarSesion()}"
                                     process="@form" update="messages dataTable">
                        <p:confirm message="#{labels['msg.eliminarRegistro']}"/>
                    </p:commandButton>
                    <p:commandButton value="#{labels['dict.borrarTodo']}" icon="pi pi-trash" iconPos="top"
                                     action="#{viewSesiones.borrarTodasSesiones()}"
                                     process="@form" update="messages dataTable">
                        <p:confirm message="#{labels['msg.eliminarRegistros']}"/>
                    </p:commandButton>
                </f:facet>
            </p:toolbar>
            <p:dataTable id="dataTable" value="#{viewSesiones.lazyModel}" var="sesion"
                         paginator="true" lazy="true" filterDelay="300" widgetVar="seccionTable"
                         rows="#{viewSesiones.filtro.paginaTamanyo}" rowsPerPageTemplate="10,20,50,100"
                         first="#{viewSesiones.filtro.paginaFirst}"
                         paginatorPosition="bottom" paginatorAlwaysVisible="true"
                         paginatorTemplate="{RowsPerPageLabel} {RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport}
                         {NextPageLink} {LastPageLink}"
                         currentPageReportTemplate="#{labels.dataTable_currentPageReport} - #{labels.dataTable_elementsFound}: {totalRecords}"
                         emptyMessage="#{labels['dict.noHayDatos']}"
                         selectionMode="single" selection="#{viewSesiones.datoSeleccionado}"
                         rowKey="#{sesion.idUsuario}"
                         reflow="true"
                         sortOrder="#{viewSesiones.filtro.order}"
                         style="min-height: 300px;"
                         >
                <p:ajax
                        event="rowDblselect"
                        oncomplete="triggerDblClick();"
                        global="false"/>
                <f:facet name="{RowsPerPageLabel}">
                    #{labels.dataTable_rowsPerPage}
                </f:facet>
                <p:column sortBy="#{sesion.idUsuario}" headerText="#{labels['dict.id']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.idUsuario}"/>
                </p:column>
                <p:column sortBy="#{sesion.usuario}" headerText="#{labels['dict.usuario']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.usuario}"/>
                </p:column>
                <p:column sortBy="#{sesion.fechaUltimaSesion}" headerText="#{labels['dict.fechaUltimaSesion']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.fechaUltimaSesion}"/>
                </p:column>
                <p:column sortBy="#{sesion.perfil}" headerText="#{labels['dict.perfil']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.perfil}"/>
                </p:column>
                <p:column sortBy="#{sesion.idioma}" headerText="#{labels['dict.idioma']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.idioma}"/>
                </p:column>
                <p:column sortBy="#{sesion.idEntidad}" headerText="#{labels['dict.idEntidad']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.idEntidad}"/>
                </p:column>
                <p:column sortBy="#{sesion.idUa}" headerText="#{labels['dict.idUa']}">
                    <f:facet name="header"/>
                    <h:outputText value="#{sesion.idUa}"/>
                </p:column>
            </p:dataTable>
            <h:outputScript>
                function triggerDblClick() {
                myDoubleClickCommand();
                /*$('#form\\:btnConsultaHidden').click();*/
                }
            </h:outputScript>

        </h:form>
    </ui:define>
</ui:composition>
</html>
